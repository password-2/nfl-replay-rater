name: Update ratings

on:
  schedule:
    # Every hour at :17 (GitHub may run a few minutes late at busy times).
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch games and rate them
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "rater-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/cache.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ratings"
            git push
          fi
