name: Update ratings

on:
  schedule:
    # Every hour at :17 (GitHub often runs these late, or skips some).
    # Any run that lands during, or up to 4h before, a game keeps watching
    # until the games finish (see scripts/watch.py).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      resend:
        description: "Send a test push and resend this week's DAZN blackouts"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets the watcher start a fresh run before the 6h limit

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest commit, not the one current when the run was queued

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rate games (and watch while games are on)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND: ${{ inputs.resend }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "rater-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/watch.py
